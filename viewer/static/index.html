<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS26150 DVR Forensics</title>
<!-- Air-gapped: every asset below is served from viewer/static/ by the

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"></header>

    <nav class="sidebar" id="sidebar" aria-label="Screens"></nav>

      <nav class="stepper" id="stepper" aria-label="Pipeline stages"></nav>
      <main class="main" id="main">
        <div class="card"><div class="skel" style="width:60%;margin:9px 0"></div>
          <div class="skel" style="width:40%;margin:9px 0"></div></div>
      </main>
    </div>
  </div>
</div>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>

</html>
