<!doctype html>
<html lang="en" data-look="instrument">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnokhiDrishti — DVR/NVR Forensics</title>
<!-- The mark is an inline data: URI, not a file: a favicon is a request like
     any other, and on an air-gapped workstation nothing may leave the page. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2306080a'/%3E%3Crect x='7' y='8' width='18' height='16' rx='2' fill='none' stroke='%23c6f24e' stroke-width='2.5'/%3E%3Crect x='7' y='8' width='9' height='16' fill='%23c6f24e'/%3E%3C/svg%3E">
<script>
  // Pick the look and the theme before first paint, so the page never
  // flashes one and settles into another. Wrapped because localStorage
  // throws in a locked-down profile.
  //
  // With nothing stored, the theme follows the operating system: an
  // examiner who has set their machine light should not be handed a dark
  // console to argue with.
  try {
    const l = localStorage.getItem("anokhidrishti-look");
    if (l) document.documentElement.dataset.look = l;

    const t = localStorage.getItem("anokhidrishti-theme");
    const prefersLight = window.matchMedia
      && window.matchMedia("(prefers-color-scheme: light)").matches;
    if (t === "light" || (!t && prefersLight)) {
      document.documentElement.dataset.theme = "light";
    }
  } catch (e) { /* keep the dark default in the html attributes */ }
</script>
  <script type="module" crossorigin src="/assets/app-DSoEznAi.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-eoceBlA6.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
